name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@huntina6'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify version matches tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$VER" ]; then
            echo "❌ package.json version ($PKG) != tag version ($VER)"
            exit 1
          fi
          echo "✅ 版本一致: v$VER"

      - name: Extract changelog for this tag
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NOTES=$(node -e "
            const fs = require('fs');
            const md = fs.readFileSync('CHANGELOG.md', 'utf-8');
            // 注意：GitHub Actions 对 $GITHUB_OUTPUT 只解码 %0D%0A（CRLF），单独 %0A 会以字面量泄漏进 Release notes
            const esc = s => s.replace(/%/g, '%25').replace(/\r\n/g, '%0D%0A').replace(/\n/g, '%0D%0A').replace(/\r/g, '%0D');
            const re = new RegExp('## \\\\[' + '${VER}' + '\\\\][\\\\s\\\\S]*?(?=\\\\n## \\\\[|\\$)');
            const m = md.match(re);
            process.stdout.write(m ? esc(m[0]) : esc('详见 CHANGELOG.md'));
          ")
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body: "${{ steps.notes.outputs.notes }}"
          draft: false
          prerelease: false
          update: true

      - name: Publish to GitHub Packages (npm)
        if: ${{ secrets.PACKAGES_TOKEN != '' }}
        continue-on-error: true # token 过期/权限不足时不阻塞 Release（发不出时会在日志给出 npm error）
        run: |
          npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Skip publish (no PACKAGES_TOKEN)
        if: ${{ secrets.PACKAGES_TOKEN == '' }}
        run: |
          echo "未配置 PACKAGES_TOKEN（个人命名空间的 npm 包需用户级 PAT，GITHUB_TOKEN 无法写入）→ 跳过包发布，Release 正常完成"
