name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@huntina6'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify version matches tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$VER" ]; then
            echo "❌ package.json version ($PKG) != tag version ($VER)"
            exit 1
          fi
          echo "✅ 版本一致: v$VER"

      # 多行 Release notes 走文件（body_path），不要用 $GITHUB_OUTPUT + %0A 转义：
      # 实测该转义不会在读取时被解码回换行，整段 CHANGELOG 会变成一行带 %0D%0A 字面量的文本
      # （v1.7.0 首次发布即踩此坑 → 改为文件传递并重跑修复）。
      - name: Extract changelog for this tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const md = fs.readFileSync('CHANGELOG.md', 'utf-8');
            const re = new RegExp('## \\\\[' + '${VER}' + '\\\\][\\\\s\\\\S]*?(?=\\\\n## \\\\[|\$)');
            const m = md.match(re);
            fs.writeFileSync('/tmp/release-notes.md', m ? m[0] : '详见 CHANGELOG.md');
          "
          echo '--- Release notes 预览（前 3 行）---'
          head -3 /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
          update: true

      # 注意：secrets 上下文不允许出现在 if 条件里（steps[*].if 的可用上下文为
      # github/needs/strategy/matrix/job/runner/env/vars/steps/inputs，不含 secrets）。
      # 一旦写成 if: ${{ secrets.X != '' }}，GitHub 会把整个工作流文件判为无效：
      # 运行秒失败、不产生任何 job、工作流名退化为文件路径（本仓库自 v1.5.0 tag 起即如此）。
      # 因此合并为一个步骤，在 run 里做运行时判断；secret 仍只在该步骤的 env 中可见。
      # 另外不用 continue-on-error 掩码失败：显式捕获并输出 ::warning 注解（在运行 Summary 上可见），
      # 既保持「包发布失败不阻塞 Release」的既定策略，又不把失败伪装成成功
      # （v1.7.0 首次发布时 PACKAGES_TOKEN 就是 E401 失败被掩码，只能翻日志才发现）。
      - name: Publish to GitHub Packages (npm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning title=未配置 PACKAGES_TOKEN::个人命名空间的 npm 包需用户级 PAT（GITHUB_TOKEN 无法写入）→ 跳过包发布，Release 不受影响"
            exit 0
          fi
          if ! npm publish --registry=https://npm.pkg.github.com; then
            echo "::warning title=包发布失败::PACKAGES_TOKEN 无效或缺少 write:packages 权限 → 已跳过包发布（Release 不受影响，原因见上方 npm error）"
          fi
